[project]
name = "login-investigator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fpdf2==2.8.9",
    "langchain==1.3.1",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pypdf==6.20.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
